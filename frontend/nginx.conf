# Cấu hình nginx phục vụ SPA + chuyển tiếp /api sang backend (cùng origin → không dính CORS).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mọi request /api/... -> backend Spring Boot (giữ nguyên tiền tố /api).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cho phép tải PDF/Excel lớn, không cache nhầm
        proxy_read_timeout 120s;
    }

    # SPA fallback: route phía client (React Router) -> trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
